apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: 'git@github.com:temmaw/weather-app-manifests.git'
    targetRevision: master
    path: .
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: weather

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
